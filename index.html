<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login — የሆቴል ሽያጭ እና ወጪ መከታተያ</title>
<meta name="theme-color" content="#2c5282">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #3182ce 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1a202c;
  }
  .login-box {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo-icon {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 10px;
  }
  .logo h1 {
    font-size: 19px;
    font-weight: 800;
    color: #1a365d;
    letter-spacing: 0.3px;
  }
  .logo p {
    font-size: 12px;
    color: #718096;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: #4a5568;
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 14px 14px;
    font-size: 15px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    background: #f7fafc;
    outline: none;
    transition: all 0.2s;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus {
    border-color: #3182ce;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(49, 130, 206, 0.1);
  }
  .btn-login {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #1a365d, #2c5282);
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
    letter-spacing: 0.3px;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(26, 54, 93, 0.3);
  }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .error-box {
    background: #fff5f5;
    border: 1.5px solid #fc8181;
    color: #c53030;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    display: none;
    animation: shake 0.3s ease;
  }
  .error-box.show { display: block; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .info-box {
    background: #ebf8ff;
    border: 1px solid #90cdf4;
    color: #2c5282;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 20px;
  }
  .info-box strong { color: #1a365d; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  /* Dashboard preview */
  .dashboard {
    display: none;
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .dashboard.show { display: block; }
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid #edf2f7;
  }
  .dash-header h2 {
    font-size: 18px;
    font-weight: 800;
    color: #1a365d;
  }
  .dash-user {
    font-size: 12px;
    color: #718096;
    margin-top: 4px;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .badge.owner { background: #fefcbf; color: #744210; }
  .badge.accountant { background: #c6f6d5; color: #22543d; }
  .btn-logout {
    background: #c53030;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 20px;
    width: 100%;
    transition: all 0.2s;
  }
  .btn-logout:active { transform: scale(0.98); }
  .success-box {
    background: #f0fff4;
    border: 1px solid #68d391;
    color: #22543d;
    padding: 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .success-box strong { color: #276749; }
  .role-info {
    background: #f7fafc;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    font-size: 13px;
    line-height: 1.7;
    color: #4a5568;
  }
  .role-info h3 {
    font-size: 14px;
    color: #2c5282;
    margin-bottom: 10px;
  }
  .role-info ul {
    padding-left: 20px;
  }
  .role-info li { margin-bottom: 4px; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-box" id="loginBox">
  <div class="logo">
    <div class="logo-icon">🏨</div>
    <h1>የሆቴል ሽያጭ እና ወጪ መከታተያ</h1>
    <p>Sales &amp; Expense Tracker</p>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="form-group">
    <label>📧 Email</label>
    <input type="email" id="emailInput" placeholder="owner@hotel.com" autocomplete="email" autocomplete="off">
  </div>

  <div class="form-group">
    <label>🔒 Password</label>
    <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">
    <span id="loginBtnText">🔓 ግባ</span>
  </button>

  <div class="info-box">
    <strong>ℹ️ የሙከራ መረጃ፦</strong><br>
    👤 ባለቤት: <strong>owner@hotel.com</strong> / <strong>owner123456</strong><br>
    💼 አካውንታንት: <strong>accountant@hotel.com</strong> / <strong>acc123456</strong>
  </div>
</div>

<!-- ===== DASHBOARD PREVIEW ===== -->
<div class="dashboard" id="dashboardBox">
  <div class="dash-header">
    <div>
      <h2>🏨 Dashboard</h2>
      <div class="dash-user" id="userEmail">—</div>
    </div>
    <span class="badge" id="userRoleBadge">—</span>
  </div>

  <div class="success-box">
    ✅ <strong>በተከበረ ሁኔታ ገብተሃል!</strong><br>
    🎯 <strong>ደረጃ 1 ተሳክቷል</strong> — Firebase Login ይሰራል!
  </div>

  <div class="role-info" id="roleInfo"></div>

  <button class="btn-logout" onclick="doLogout()">🚪 ውጣ (Logout)</button>
</div>

<!-- ===== FIREBASE SDK ===== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // ===== Firebase Config =====
  const firebaseConfig = {
    apiKey: "AIzaSyDcA1t2fOA98U9KsngvDEih6TmEZb1-v0E",
    authDomain: "hotel-tracker-c3571.firebaseapp.com",
    projectId: "hotel-tracker-c3571",
    storageBucket: "hotel-tracker-c3571.firebasestorage.app",
    messagingSenderId: "1024629386649",
    appId: "1:1024629386649:web:c689f920c780e400797708"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ===== DOM =====
  const loginBox = document.getElementById('loginBox');
  const dashboardBox = document.getElementById('dashboardBox');
  const errorBox = document.getElementById('errorBox');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginBtnText = document.getElementById('loginBtnText');
  const userEmail = document.getElementById('userEmail');
  const userRoleBadge = document.getElementById('userRoleBadge');
  const roleInfo = document.getElementById('roleInfo');

  // ===== Global Error Handler =====
  function showError(msg) {
    errorBox.textContent = '⚠️ ' + msg;
    errorBox.classList.add('show');
    setTimeout(() => errorBox.classList.remove('show'), 6000);
  }

  // ===== Role Detection =====
  function getUserRole(email) {
    if (!email) return 'unknown';
    if (email.startsWith('owner@')) return 'owner';
    if (email.startsWith('accountant@')) return 'accountant';
    return 'unknown';
  }

  function getRoleInfo(role) {
    if (role === 'owner') {
      return {
        label: '👑 ባለቤት',
        cls: 'owner',
        desc: `<h3>👑 እንደ ባለቤት ገብተሃል</h3>
               <ul>
                 <li>✅ ሁሉንም ሪፖርቶች ማየት</li>
                 <li>✅ የቀን ሂሳብ</li>
                 <li>✅ የወር ሂሳብ</li>
                 <li>✅ ቶፕ ሴለር ማየት</li>
                 <li>✅ ያልተሸጡ ምርቶች</li>
                 <li>✅ የቀን ታሪክ</li>
               </ul>`
      };
    } else if (role === 'accountant') {
      return {
        label: '💼 አካውንታንት',
        cls: 'accountant',
        desc: `<h3>💼 እንደ አካውንታንት ገብተሃል</h3>
               <ul>
                 <li>✅ ሽያጭ ማስገባት</li>
                 <li>✅ ወጪ ማስገባት</li>
                 <li>✅ የዛሬ ሂሳብ ማስቀመጥ</li>
                 <li>✅ ሪፖርት ማየት</li>
                 <li>❌ ሌሎች ተጠቃሚዎች ማስተዳደር</li>
               </ul>`
      };
    }
    return {
      label: '❓ ያልታወቀ',
      cls: 'accountant',
      desc: '<h3>❓ ያልታወቀ የተጠቃሚ ዓይነት</h3><p>እባክህ አስተዳዳሪውን አግኝ።</p>'
    };
  }

  // ===== Show Dashboard =====
  function showDashboard(user) {
    const role = getUserRole(user.email);
    const info = getRoleInfo(role);

    userEmail.textContent = user.email;
    userRoleBadge.textContent = info.label;
    userRoleBadge.className = 'badge ' + info.cls;
    roleInfo.innerHTML = info.desc;

    loginBox.style.display = 'none';
    dashboardBox.classList.add('show');
  }

  // ===== Show Login =====
  function showLogin() {
    dashboardBox.classList.remove('show');
    loginBox.style.display = 'block';
    passwordInput.value = '';
  }

  // ===== Login =====
  window.doLogin = async function() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email) { showError('Email ያስፈልጋል'); return; }
    if (!password) { showError('Password ያስፈልጋል'); return; }

    loginBtn.disabled = true;
    loginBtnText.innerHTML = '<span class="spinner"></span> በመግባት ላይ...';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged ይይዘዋል
    } catch (err) {
      console.error('Login error:', err);
      let msg = 'የ Login ስህተት';
      const code = err.code || '';
      if (code.includes('invalid-email')) msg = 'Email ትክክል አይደለም';
      else if (code.includes('user-not-found')) msg = 'ይህ ተጠቃሚ አልተገኘም';
      else if (code.includes('wrong-password') || code.includes('invalid-credential')) msg = 'Password ትክክል አይደለም';
      else if (code.includes('too-many-requests')) msg = 'ብዙ ሙከራ — ቆየት ብለህ ሞክር';
      else if (code.includes('network')) msg = 'የኢንተርኔት ግንኙነት የለም';
      else msg = msg + ': ' + (err.message || code);
      showError(msg);
      loginBtn.disabled = false;
      loginBtnText.textContent = '🔓 ግባ';
    }
  };

  // ===== Logout =====
  window.doLogout = async function() {
    if (!confirm('እርግጠኛ ነህ መውጣት ትፈልጋለህ?')) return;
    try {
      await signOut(auth);
      showLogin();
    } catch (err) {
      showError('የ Logout ስህተት: ' + err.message);
    }
  };

  // ===== Auth State =====
  onAuthStateChanged(auth, (user) => {
    if (user) {
      showDashboard(user);
    } else {
      showLogin();
    }
    loginBtn.disabled = false;
    loginBtnText.textContent = '🔓 ግባ';
  });

  // ===== Enter key =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && loginBox.style.display !== 'none') {
      doLogin();
    }
  });
</script>

</body>
</html>
